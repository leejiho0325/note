<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강의 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --ink: #1C1C1E;
    --ink-soft: #8E8E93;
    --separator: #E5E5EA;
    --blue: #007AFF;
    --blue-soft: #E8F1FF;
    --red: #FF3B30;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --radius: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'SF Pro Text', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    letter-spacing: -0.01em;
  }

  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-right: 1px solid var(--separator);
    padding: 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .brand {
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.02em;
    color: var(--ink);
    padding: 0 8px;
  }
  .brand .dot { color: var(--blue); }

  .course-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .course-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 14.5px;
    color: var(--ink);
    transition: background 0.15s ease;
  }
  .course-item:hover { background: rgba(0,0,0,0.04); }
  .course-item.active {
    background: var(--blue);
    color: #fff;
    font-weight: 600;
  }
  .course-item.active .count,
  .course-item.active .swatch { color: #fff; }
  .course-item .swatch {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--swatch, var(--blue));
    flex-shrink: 0;
  }
  .course-item.active .swatch { background: #fff; }
  .course-item .count {
    margin-left: auto;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .course-item.active .count { color: rgba(255,255,255,0.85); }
  .course-item .del-course {
    display: none;
    border: none; background: none; cursor: pointer;
    color: inherit; font-size: 14px; padding: 0 2px;
    opacity: 0.7;
  }
  .course-item:hover .del-course { display: inline-block; }
  .course-item:hover .count { display: none; }

  .add-course {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
    padding: 14px 8px 0;
    border-top: 1px solid var(--separator);
  }
  .add-course input[type=text] {
    border: none;
    background: rgba(118,118,128,0.12);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
  }
  .add-course input[type=text]:focus { outline: 2px solid var(--blue); outline-offset: 0; }
  .color-picker { display: flex; gap: 8px; padding: 2px 2px; }
  .color-swatch {
    width: 20px; height: 20px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
  }
  .color-swatch.selected { border-color: var(--ink); box-shadow: 0 0 0 2px #fff inset; }
  .add-course button {
    border: none;
    background: var(--blue);
    color: #fff;
    padding: 9px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .add-course button:hover { background: #0066d6; }

  .sidebar-foot {
    margin-top: auto;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 8px;
  }
  .sidebar-foot button {
    background: none; border: none; color: var(--red);
    cursor: pointer; font-size: 12.5px; padding: 0;
    font-family: inherit;
  }

  .user-badge {
    font-size: 12.5px;
    color: var(--ink-soft);
    padding: 12px 8px 0;
    border-top: 1px solid var(--separator);
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .user-badge button {
    align-self: flex-start;
    background: none; border: none; color: var(--red);
    cursor: pointer; font-size: 12.5px; padding: 0;
    font-family: inherit;
  }

  /* ---------- Main ---------- */
  .main {
    padding: 40px 48px 80px;
    max-width: 760px;
  }

  .main-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 20px;
  }

  .main-head h1 {
    font-weight: 700;
    font-size: 30px;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }
  .main-head .sub { font-size: 13.5px; color: var(--ink-soft); }

  .search {
    border: none;
    background: rgba(118,118,128,0.12);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 14px;
    font-family: inherit;
    width: 200px;
  }
  .search:focus { outline: 2px solid var(--blue); outline-offset: 0; }

  .new-btn {
    border: none;
    background: var(--blue);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .new-btn:hover { background: #0066d6; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 26px; }

  /* ---------- Note form ---------- */
  .note-form {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 26px;
    box-shadow: var(--shadow);
  }
  .note-form .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .note-form select, .note-form input[type=text], .note-form input[type=date] {
    border: none;
    background: rgba(118,118,128,0.10);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink);
  }
  .note-form input[type=text].title-input {
    flex: 1;
    font-size: 17px;
    font-weight: 700;
    background: transparent;
    padding: 6px 4px;
  }
  .note-form textarea {
    width: 100%;
    min-height: 140px;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink);
    resize: vertical;
    background: rgba(118,118,128,0.06);
  }
  .note-form .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .note-form .actions button {
    border: none;
    background: rgba(118,118,128,0.12);
    color: var(--ink);
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .note-form .actions .save { background: var(--blue); color: #fff; }
  .note-form .actions .save:hover { background: #0066d6; }
  .note-form .actions .cancel:hover { background: rgba(118,118,128,0.2); }

  /* ---------- Notes list ---------- */
  .day-group { margin-bottom: 28px; }
  .day-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 10px;
    padding-left: 4px;
    text-transform: none;
  }

  .note-card {
    position: relative;
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .note-card .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .note-card h3 {
    font-size: 16.5px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .note-card .tag {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--swatch, var(--blue));
    background: color-mix(in srgb, var(--swatch, var(--blue)) 14%, white);
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .note-card .content {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
  }
  .note-card .card-actions {
    position: absolute;
    top: 14px; right: 16px;
    display: none;
    gap: 10px;
  }
  .note-card:hover .card-actions { display: flex; }
  .note-card .card-actions button {
    border: none;
    background: rgba(118,118,128,0.10);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--blue);
    font-family: inherit;
    padding: 5px 11px;
    border-radius: 12px;
    line-height: 1.3;
  }
  .note-card .card-actions button[data-del] { color: var(--red); background: rgba(255,59,48,0.10); }

  .empty {
    text-align: center;
    padding: 70px 20px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .empty .big {
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 6px;
  }

  /* ---------- Auth ---------- */
  .auth-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .auth-box {
    background: var(--card);
    border-radius: 20px;
    padding: 36px 32px;
    width: 320px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .auth-box h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .auth-box .sub { font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }
  .auth-box input {
    width: 100%;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 13px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 10px;
    background: rgba(118,118,128,0.10);
    color: var(--ink);
  }
  .auth-box input:focus { outline: 2px solid var(--blue); outline-offset: 0; }
  .auth-box button.primary {
    width: 100%;
    border: none;
    background: var(--blue);
    color: #fff;
    padding: 12px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    margin-top: 4px;
  }
  .auth-box button.primary:hover { background: #0066d6; }
  .auth-box .switch {
    text-align: center;
    margin-top: 16px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .auth-box .switch button {
    background: none; border: none; color: var(--blue);
    cursor: pointer; font-size: 13px; font-weight: 600;
    font-family: inherit; padding: 0;
  }
  .auth-error {
    background: #FFEBEA;
    color: var(--red);
    font-size: 12.5px;
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
  }

  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      flex-direction: row;
      overflow-x: auto;
      align-items: center;
      padding: 12px 16px;
      backdrop-filter: blur(20px) saturate(180%);
    }
    .brand { display: none; }
    .add-course { display: none; }
    .course-list { flex-direction: row; }
    .sidebar-foot, .user-badge { display: none; }
    .main { padding: 24px 20px 60px; }
    .main-head { flex-wrap: wrap; }
    .search { width: 140px; }
  }
</style>
</head>
<body>

<div class="auth-screen" id="authScreen" style="display:none;">
  <div class="auth-box">
    <h1>강의 노트</h1>
    <div class="sub" id="authSub">이메일과 비밀번호로 로그인하세요</div>
    <div id="authError"></div>
    <input type="email" id="authEmail" placeholder="이메일">
    <input type="password" id="authPassword" placeholder="비밀번호 (6자 이상)">
    <button class="primary" id="authSubmit">로그인</button>
    <div class="switch">
      <span id="switchText">계정이 없나요?</span>
      <button id="switchMode">회원가입</button>
    </div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none;">
  <aside class="sidebar">
    <div class="brand">강의 노트<span class="dot">.</span></div>
    <div class="course-list" id="courseList"></div>
    <div class="add-course">
      <input type="text" id="newCourseName" placeholder="새 과목 이름">
      <div class="color-picker" id="colorPicker"></div>
      <button id="addCourseBtn">과목 추가</button>
    </div>
    <div class="user-badge">
      <span id="userEmail"></span>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </aside>

  <main class="main">
    <div class="main-head">
      <div>
        <h1 id="mainTitle">전체 노트</h1>
        <div class="sub" id="mainSub">과목을 선택해 필터링할 수 있어요</div>
      </div>
      <input type="text" class="search" id="searchInput" placeholder="제목·내용 검색">
    </div>

    <div class="toolbar">
      <button class="new-btn" id="newNoteBtn">+ 새 강의 노트</button>
    </div>

    <div id="formSlot"></div>
    <div id="notesSlot"></div>
  </main>
</div>

<script>
// ====== Supabase 설정 (본인 프로젝트 값으로 교체하세요) ======
const SUPABASE_URL = 'https://cylgoxjtbmnqneuaqhem.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fmD4e9gOhvN-cqqio5QgaQ_nZeiC70P';
// ============================================================

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const COLORS = ['#7A3B33', '#47614f', '#b9902f', '#3d5a80', '#7d5ba6', '#a13d63'];

let state = {
  courses: [],
  notes: [],
  activeCourse: 'all',
  editingId: null,
  search: '',
  formOpen: false,
  loaded: false,
  session: null,
};

let authMode = 'login'; // 'login' | 'signup'

// ---------- Auth ----------
async function initAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  state.session = session;
  if (session) {
    showApp();
  } else {
    showAuth();
  }

  supabaseClient.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    if (session) {
      showApp();
    } else {
      showAuth();
    }
  });
}

function showAuth() {
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appRoot').style.display = 'none';
}

async function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appRoot').style.display = 'grid';
  document.getElementById('userEmail').textContent = state.session.user.email;
  await loadState();
}

function setAuthError(msg) {
  const el = document.getElementById('authError');
  el.innerHTML = msg ? `<div class="auth-error">${escapeHtml(msg)}</div>` : '';
}

document.getElementById('switchMode').addEventListener('click', () => {
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authSubmit').textContent = authMode === 'login' ? '로그인' : '회원가입';
  document.getElementById('authSub').textContent = authMode === 'login' ? '이메일과 비밀번호로 로그인하세요' : '새 계정을 만드세요';
  document.getElementById('switchText').textContent = authMode === 'login' ? '계정이 없나요?' : '이미 계정이 있나요?';
  document.getElementById('switchMode').textContent = authMode === 'login' ? '회원가입' : '로그인';
  setAuthError('');
});

document.getElementById('authSubmit').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) { setAuthError('이메일과 비밀번호를 입력하세요.'); return; }
  setAuthError('');

  if (authMode === 'login') {
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) setAuthError(error.message);
  } else {
    const { error } = await supabaseClient.auth.signUp({ email, password });
    if (error) setAuthError(error.message);
    else setAuthError('가입 확인 메일을 보냈어요. 확인 후 로그인하세요.');
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
});

// ---------- Data load / persist (Supabase) ----------
async function loadState() {
  const userId = state.session.user.id;

  const { data: courses, error: cErr } = await supabaseClient
    .from('courses').select('*').order('created_at', { ascending: true });
  if (cErr) { alert('과목 목록을 불러오지 못했어요: ' + cErr.message); }
  state.courses = courses || [];

  const { data: notes, error: nErr } = await supabaseClient
    .from('notes').select('*').order('created_at', { ascending: true });
  if (nErr) { alert('노트 목록을 불러오지 못했어요: ' + nErr.message); }
  state.notes = notes || [];

  if (state.courses.length === 0) {
    const defaults = [
      { user_id: userId, name: '교양스페인어', color: COLORS[0] },
      { user_id: userId, name: '기초일본어', color: COLORS[1] },
      { user_id: userId, name: '대학합창II', color: COLORS[2] },
      { user_id: userId, name: '인공지능과사람', color: COLORS[3] },
      { user_id: userId, name: '인권과평화', color: COLORS[4] },
      { user_id: userId, name: '전공진로세미나', color: COLORS[5] },
      { user_id: userId, name: '졸업지도', color: COLORS[0] },
      { user_id: userId, name: '천문학의 세계', color: COLORS[1] },
    ];
    await supabaseClient.from('courses').insert(defaults);
    const { data: freshCourses } = await supabaseClient.from('courses').select('*').order('created_at', { ascending: true });
    state.courses = freshCourses || [];
  }

  state.loaded = true;
  render();
}

async function addCourseRemote(name, color) {
  const userId = state.session.user.id;
  const { data, error } = await supabaseClient
    .from('courses').insert([{ user_id: userId, name, color }]).select();
  if (error) throw new Error('과목 추가 실패: ' + error.message);
  if (!data || !data[0]) throw new Error('과목 추가 실패: 서버 응답이 비어있어요');
  state.courses.push(data[0]);
}

async function deleteCourseRemote(id) {
  const { error } = await supabaseClient.from('courses').delete().eq('id', id);
  if (error) throw new Error('삭제 실패: ' + error.message);
  state.courses = state.courses.filter(c => c.id !== id);
}

async function saveNoteRemote({ id, courseId, date, title, content }) {
  const userId = state.session.user.id;
  if (id) {
    const { error } = await supabaseClient
      .from('notes').update({ course_id: courseId, date, title, content }).eq('id', id);
    if (error) throw new Error('수정 실패: ' + error.message);
    const note = state.notes.find(n => n.id === id);
    Object.assign(note, { course_id: courseId, date, title, content });
  } else {
    const { data, error } = await supabaseClient
      .from('notes').insert([{ user_id: userId, course_id: courseId, date, title, content }]).select();
    if (error) throw new Error('저장 실패: ' + error.message);
    if (!data || !data[0]) throw new Error('저장 실패: 서버 응답이 비어있어요');
    state.notes.push(data[0]);
  }
}

async function deleteNoteRemote(id) {
  const { error } = await supabaseClient.from('notes').delete().eq('id', id);
  if (error) throw new Error('삭제 실패: ' + error.message);
  state.notes = state.notes.filter(n => n.id !== id);
}

function courseById(id) { return state.courses.find(c => c.id === id); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- Render ----------
function renderSidebar() {
  const list = document.getElementById('courseList');
  const allCount = state.notes.length;
  let html = `<div class="course-item ${state.activeCourse==='all'?'active':''}" data-course="all">
      <span class="swatch" style="background:var(--ink)"></span>
      <span>전체</span><span class="count">${allCount}</span>
    </div>`;
  html += state.courses.map(c => {
    const count = state.notes.filter(n => n.course_id === c.id).length;
    return `<div class="course-item ${state.activeCourse===c.id?'active':''}" data-course="${c.id}" style="--swatch:${c.color}">
      <span class="swatch"></span>
      <span>${escapeHtml(c.name)}</span>
      <span class="count">${count}</span>
      <button class="del-course" data-delcourse="${c.id}" title="과목 삭제">✕</button>
    </div>`;
  }).join('');
  list.innerHTML = html;

  const picker = document.getElementById('colorPicker');
  if (!picker.dataset.built) {
    picker.innerHTML = COLORS.map((col,i) => `<div class="color-swatch ${i===0?'selected':''}" data-color="${col}" style="background:${col}"></div>`).join('');
    picker.dataset.built = '1';
    picker.dataset.selected = COLORS[0];
  }
}

function renderHeader() {
  const title = document.getElementById('mainTitle');
  const sub = document.getElementById('mainSub');
  if (state.activeCourse === 'all') {
    title.textContent = '전체 노트';
    sub.textContent = '과목을 선택해 필터링할 수 있어요';
  } else {
    const c = courseById(state.activeCourse);
    title.textContent = c ? c.name : '전체 노트';
    sub.textContent = `${state.notes.filter(n=>n.course_id===state.activeCourse).length}개의 강의 기록`;
  }
}

function getFilteredNotes() {
  let list = state.notes;
  if (state.activeCourse !== 'all') list = list.filter(n => n.course_id === state.activeCourse);
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    list = list.filter(n => n.title.toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q));
  }
  return [...list].sort((a,b) => (b.date + b.created_at).localeCompare(a.date + a.created_at));
}

function groupByDate(notes) {
  const groups = {};
  notes.forEach(n => {
    if (!groups[n.date]) groups[n.date] = [];
    groups[n.date].push(n);
  });
  return Object.entries(groups);
}

function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}

function renderNotes() {
  const slot = document.getElementById('notesSlot');
  const filtered = getFilteredNotes();
  if (filtered.length === 0) {
    slot.innerHTML = `<div class="empty">
      <div class="big">아직 기록된 강의 노트가 없어요</div>
      <div>새 강의 노트 버튼을 눌러 오늘 들은 수업을 정리해보세요.</div>
    </div>`;
    return;
  }
  const groups = groupByDate(filtered);
  slot.innerHTML = groups.map(([date, notes]) => `
    <div class="day-group">
      <div class="day-label">${fmtDate(date)}</div>
      ${notes.map(n => {
        const c = courseById(n.course_id);
        const color = c ? c.color : '#7A3B33';
        return `<div class="note-card" style="--swatch:${color}">
          <div class="card-actions">
            <button data-edit="${n.id}">수정</button>
            <button data-del="${n.id}">삭제</button>
          </div>
          <div class="top">
            <h3>${escapeHtml(n.title)}</h3>
            <span class="tag">${c ? escapeHtml(c.name) : '삭제된 과목'}</span>
          </div>
          <div class="content">${escapeHtml(n.content || '')}</div>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

function renderForm() {
  const slot = document.getElementById('formSlot');
  if (!state.formOpen) { slot.innerHTML = ''; return; }

  const editing = state.editingId ? state.notes.find(n => n.id === state.editingId) : null;
  const defaultCourse = editing ? editing.course_id : (state.activeCourse !== 'all' ? state.activeCourse : (state.courses[0] ? state.courses[0].id : ''));
  const defaultDate = editing ? editing.date : new Date().toISOString().slice(0,10);

  slot.innerHTML = `
    <div class="note-form">
      <div class="row">
        <select id="formCourse">
          ${state.courses.map(c => `<option value="${c.id}" ${c.id===defaultCourse?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>
        <input type="date" id="formDate" value="${defaultDate}">
      </div>
      <div class="row">
        <input type="text" class="title-input" id="formTitle" placeholder="강의 주제 / 제목" value="${editing ? escapeHtml(editing.title) : ''}">
      </div>
      <textarea id="formContent" placeholder="수업 내용을 정리하세요...">${editing ? escapeHtml(editing.content || '') : ''}</textarea>
      <div class="actions">
        <button class="cancel" id="formCancel">취소</button>
        <button class="save" id="formSave">${editing ? '수정 완료' : '저장'}</button>
      </div>
    </div>
  `;
}

function render() {
  if (!state.loaded) return;
  renderSidebar();
  renderHeader();
  renderForm();
  renderNotes();
}

document.addEventListener('click', async (e) => {
 try {
  const courseEl = e.target.closest('[data-course]');
  if (courseEl) {
    state.activeCourse = courseEl.dataset.course;
    render();
    return;
  }

  const delCourse = e.target.closest('[data-delcourse]');
  if (delCourse) {
    e.stopPropagation();
    const id = delCourse.dataset.delcourse;
    if (confirm('이 과목과 관련된 노트도 함께 사라지지 않아요. 과목만 삭제할까요?')) {
      await deleteCourseRemote(id);
      if (state.activeCourse === id) state.activeCourse = 'all';
      render();
    }
    return;
  }

  if (e.target.closest('.color-swatch')) {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    e.target.classList.add('selected');
    document.getElementById('colorPicker').dataset.selected = e.target.dataset.color;
    return;
  }

  if (e.target.id === 'addCourseBtn') {
    const nameInput = document.getElementById('newCourseName');
    const name = nameInput.value.trim();
    if (!name) return;
    const color = document.getElementById('colorPicker').dataset.selected || COLORS[0];
    await addCourseRemote(name, color);
    nameInput.value = '';
    render();
    return;
  }

  if (e.target.id === 'newNoteBtn') {
    if (state.courses.length === 0) { alert('먼저 과목을 추가해주세요.'); return; }
    state.editingId = null;
    state.formOpen = true;
    render();
    document.getElementById('formTitle')?.focus();
    return;
  }

  if (e.target.closest('[data-edit]')) {
    const id = e.target.closest('[data-edit]').dataset.edit;
    state.editingId = id;
    state.formOpen = true;
    render();
    return;
  }

  if (e.target.closest('[data-del]')) {
    const id = e.target.closest('[data-del]').dataset.del;
    if (confirm('이 노트를 삭제할까요?')) {
      await deleteNoteRemote(id);
      render();
    }
    return;
  }

  if (e.target.id === 'formCancel') {
    state.formOpen = false;
    state.editingId = null;
    render();
    return;
  }

  if (e.target.id === 'formSave') {
    const courseId = document.getElementById('formCourse').value;
    const date = document.getElementById('formDate').value;
    const title = document.getElementById('formTitle').value.trim();
    const content = document.getElementById('formContent').value.trim();
    if (!title) { alert('제목을 입력해주세요.'); return; }
    if (!courseId) { alert('과목을 선택해주세요.'); return; }

    await saveNoteRemote({ id: state.editingId, courseId, date, title, content });
    state.formOpen = false;
    state.editingId = null;
    render();
    return;
  }
 } catch (err) {
  console.error(err);
  alert('오류가 발생했어요: ' + (err && err.message ? err.message : err));
 }
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  renderNotes();
});

initAuth();
</script>
</body>
</html>
